services:
  api:
    container_name: api
    volumes:
      - ../dev.sqlite3:/api/dev.sqlite3:z
    image: docker.io/krakekrake/placeholder-store:backend-latest
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION=3600
      - DB_URL=sqlite:////api/dev.sqlite3 # Temporary sqlite file, swap for the real database URL later
    expose:
      - 8000
  frontend:
    container_name: frontend
    image: docker.io/krakekrake/placeholder-store:frontend-latest
    environment:
      - API_URL=http://api:/8000
    ports:
      - "8080:80"
