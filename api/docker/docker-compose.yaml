services:
  api:
    container_name: login-api
    build:
      context: ../
      dockerfile: docker/Dockerfile
    volumes:
      - ../dev.sqlite3:/api/dev.sqlite3:z
    image: docker.io/krakekrake/placeholder-store:backend-latest
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION=3600
      - DB_URL=sqlite:////api/dev.sqlite3 # Temporary sqlite file, swap for the real database URL later
    ports:
      - "8000:8000"
