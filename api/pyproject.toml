[project]
name = "api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi==0.143.2",
    "pydantic==2.14.1",
    "pyjwt>=2.15.0",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.3",
    "sqlalchemy==2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
