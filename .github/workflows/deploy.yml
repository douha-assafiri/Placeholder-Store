name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      api_image:
        type: string
        required: true
      frontend_image:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      NAME: placeholder-store-${{ inputs.environment }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_api_image: ${{ inputs.api_image }}
      TF_VAR_frontend_image: ${{ inputs.frontend_image }}
      TF_VAR_certificate_arn: ${{ inputs.environment == 'production' && vars.PRODUCTION_CERTIFICATE_ARN || vars.STAGING_CERTIFICATE_ARN }}
      TF_VAR_frontend_host: ${{ inputs.environment == 'production' && vars.PRODUCTION_FRONTEND_HOST || vars.STAGING_FRONTEND_HOST }}
      TF_VAR_uptime_host: ${{ inputs.environment == 'production' && vars.PRODUCTION_UPTIME_HOST || vars.STAGING_UPTIME_HOST }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2

    # ---- Infrastructure ----
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4
    - name: Terraform init
      working-directory: infra/terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
          -backend-config="key=placeholder-store/${{ inputs.environment }}.tfstate"
    - name: Terraform plan
      working-directory: infra/terraform
      run: terraform plan -lock-timeout=5m -out=tfplan
    - name: Terraform apply
      working-directory: infra/terraform
      run: terraform apply -lock-timeout=5m tfplan
    - name: Get the task definitions Terraform created
      run: |
        aws ecs describe-task-definition --task-definition "$NAME-api" --query taskDefinition > api-task.json
        aws ecs describe-task-definition --task-definition "$NAME-frontend" --query taskDefinition > frontend-task.json
    - name: Fill in the new API image
      id: api-task
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: api-task.json
        container-name: api
        image: ${{ inputs.api_image }}
    - name: Deploy the API
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.api-task.outputs.task-definition }}
        service: ${{ env.NAME }}-api
        cluster: ${{ env.NAME }}
        wait-for-service-stability: true
    - name: Fill in the new frontend image
      id: frontend-task
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: frontend-task.json
        container-name: frontend
        image: ${{ inputs.frontend_image }}
    - name: Deploy the frontend
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      with:
        task-definition: ${{ steps.frontend-task.outputs.task-definition }}
        service: ${{ env.NAME }}-frontend
        cluster: ${{ env.NAME }}
        wait-for-service-stability: true
