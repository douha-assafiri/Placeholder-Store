name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      api_image:
        type: string
        required: true
      frontend_image:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_api_image: ${{ inputs.api_image }}
      TF_VAR_frontend_image: ${{ inputs.frontend_image }}
      TF_VAR_frontend_host: ${{ inputs.environment == 'production' && vars.PRODUCTION_FRONTEND_HOST || vars.STAGING_FRONTEND_HOST }}
      TF_VAR_uptime_host: ${{ inputs.environment == 'production' && vars.PRODUCTION_UPTIME_HOST || vars.STAGING_UPTIME_HOST }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-southeast-2

    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.11.4
    - name: Terraform init
      working-directory: infra/terraform
      run: |
        terraform init \
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
          -backend-config="key=placeholder-store/${{ inputs.environment }}.tfstate"
    - name: Terraform plan
      working-directory: infra/terraform
      run: terraform plan -lock-timeout=5m -out=tfplan
    - name: Terraform apply
      working-directory: infra/terraform
      run: terraform apply -lock-timeout=5m tfplan
