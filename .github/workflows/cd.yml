name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' # Only on a push not on all PRs
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store:backend-${{ steps.sha.outputs.short }}
      frontend_image: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store:frontend-${{ steps.sha.outputs.short }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }} # The commit CI tested
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PAT }}
    - name: Short commit ID
      id: sha
      run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      env:
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    - name: Tag Image
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store
        tags: |
          type=raw,value=backend-latest
          type=raw,value=backend-${{ steps.sha.outputs.short }}
    - name: Build the Docker and push
      uses: docker/build-push-action@v7
      with:
        context: api
        file: api/docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=api
    # Same image for staging and production, the API is always at /api
    - name: Tag frontend image
      id: meta-frontend
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store
        tags: |
          type=raw,value=frontend-latest
          type=raw,value=frontend-${{ steps.sha.outputs.short }}
    - name: Build and push frontend image
      uses: docker/build-push-action@v7
      with:
        context: frontend
        file: frontend/docker/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}
        cache-from: type=gha,scope=frontend

  # TODO: set the AWS_DEPLOY_ENABLED repo variable to true once Terraform has run
  deploy-staging:
    needs: push
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      api_image: ${{ needs.push.outputs.api_image }}
      frontend_image: ${{ needs.push.outputs.frontend_image }}
    secrets: inherit

  e2e:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
    - uses: astral-sh/setup-uv@v7
    - name: Install Playwright browsers
      working-directory: e2e
      run: |
        uv sync --locked
        uv run playwright install --with-deps chromium firefox webkit
    - name: Run E2E tests against staging
      working-directory: e2e
      env:
        FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        API_URL: ${{ vars.FRONTEND_URL }}/api
      run: uv run pytest -v --browser chromium --browser firefox --browser webkit

  # The same images staging tested
  deploy-production:
    needs: [ push, e2e ]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      api_image: ${{ needs.push.outputs.api_image }}
      frontend_image: ${{ needs.push.outputs.frontend_image }}
    secrets: inherit
