name: CD

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-2
  API_TASK_STAGING: .aws/task-definition-api-staging.json
  API_TASK_PRODUCTION: .aws/task-definition-api-production.json
  FRONTEND_TASK_STAGING: .aws/task-definition-frontend-staging.json
  FRONTEND_TASK_PRODUCTION: .aws/task-definition-frontend-production.json
  # TODO: fill in once AWS is set up
  # ECS_CLUSTER: ps-cluster
  # API_SERVICE_STAGING: ps-api-staging
  # FRONTEND_SERVICE_STAGING: ps-frontend-staging
  # API_SERVICE_PRODUCTION: ps-api-prod
  # FRONTEND_SERVICE_PRODUCTION: ps-frontend-prod

jobs:
  push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' # Only on a push not on all PRs
    runs-on: ubuntu-latest
    outputs:
      image: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store:backend-${{ steps.sha.outputs.short }}
      staging_frontend_image: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store:frontend-staging-${{ steps.sha.outputs.short }}
      production_frontend_image: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store:frontend-production-${{ steps.sha.outputs.short }}

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }} # The commit CI tested
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PAT }}
    - name: Short commit ID
      id: sha
      run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      env:
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    - name: Tag Image
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store
        tags: |
          type=raw,value=backend-latest
          type=raw,value=backend-${{ steps.sha.outputs.short }}
    - name: Build the Docker and push
      uses: docker/build-push-action@v7
      with:
        context: api
        file: api/docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=api
    - name: Tag staging frontend image
      id: meta-frontend-staging
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store
        tags: |
          type=raw,value=frontend-staging-latest
          type=raw,value=frontend-staging-${{ steps.sha.outputs.short }}
    - name: Build and push staging frontend image
      uses: docker/build-push-action@v7
      with:
        context: frontend
        file: frontend/docker/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend-staging.outputs.tags }}
        labels: ${{ steps.meta-frontend-staging.outputs.labels }}
        cache-from: type=gha,scope=frontend-staging
        cache-to: type=gha,mode=max,scope=frontend-staging
        build-args: VITE_API_URL=https://staging-api.placeholder-store.site
    - name: Tag production frontend image
      id: meta-frontend-production
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKERHUB_USERNAME }}/placeholder-store
        tags: |
          type=raw,value=frontend-production-latest
          type=raw,value=frontend-production-${{ steps.sha.outputs.short }}
    - name: Build and push production frontend image
      uses: docker/build-push-action@v7
      with:
        context: frontend
        file: frontend/docker/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend-production.outputs.tags }}
        labels: ${{ steps.meta-frontend-production.outputs.labels }}
        cache-from: type=gha,scope=frontend-production
        cache-to: type=gha,mode=max,scope=frontend-production
        build-args: VITE_API_URL=https://api.placeholder-store.site

