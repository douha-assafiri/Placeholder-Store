name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

# One run at a time
concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  push:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' # Only on a push not on all PRs
    runs-on: ubuntu-latest
    outputs:
      api_image: ${{ steps.images.outputs.api_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }} # The commit CI tested

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Set image tags
        id: images
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          SHORT_SHA="${HEAD_SHA::7}"
          echo "api_image=docker.io/${DOCKERHUB_USERNAME}/placeholder-store:backend-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=docker.io/${DOCKERHUB_USERNAME}/placeholder-store:frontend-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: api
          file: api/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.api_image }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/placeholder-store:backend-latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      # Same image for staging and production, the API is always at /api
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/placeholder-store:frontend-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-staging:
    needs: push
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      api_image: ${{ needs.push.outputs.api_image }}
      frontend_image: ${{ needs.push.outputs.frontend_image }}
    secrets: inherit

  e2e:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: astral-sh/setup-uv@v7

      - name: Install Playwright
        working-directory: e2e
        run: |
          uv sync --locked
          uv run playwright install --with-deps chromium firefox webkit

      - name: Run staging E2E tests
        working-directory: e2e
        env:
          FRONTEND_URL: https://staging.placeholder-store.site
          API_URL: https://staging.placeholder-store.site/api
        run: uv run pytest -v --browser chromium --browser firefox --browser webkit

  # The same images staging tested
  deploy-production:
    needs: [push, e2e]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      api_image: ${{ needs.push.outputs.api_image }}
      frontend_image: ${{ needs.push.outputs.frontend_image }}
    secrets: inherit
