name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6 # This is needed to use UV as package manager
      with:
        enable-cache: true # Install the dependencies faster from a cache
    - name: Install Python and Dependencies
      run: |
        uv python install
        uv sync --locked --dev
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uvx flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude .venv
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uvx flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude .venv
    - name: Run Tests
      run: uv run pytest --cov=. --cov-report=term

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    strategy:
      matrix:
        node-version: [22.x, 24.x] # Vite needs 20.19+

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - run: npm ci
    - run: npm run lint
    - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      FRONTEND_URL: http://localhost:4173
      API_URL: http://127.0.0.1:8000

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: Start the API
      working-directory: api
      env:
        JWT_SECRET: ci-only-not-a-real-secret-0123456789abcdef
        JWT_ALGORITHM: HS256
        JWT_EXPIRATION: 1
        DB_URL: sqlite:///e2e.sqlite3
      run: |
        uv sync --locked
        uv run uvicorn main:app --port 8000 &
    - name: Start the frontend
      working-directory: frontend
      run: |
        npm ci
        npm run build
        npx vite preview --port 4173 &
    - name: Wait for the API and frontend
      run: |
        for i in $(seq 30); do
          curl -sf -o /dev/null $API_URL/docs && curl -sf -o /dev/null $FRONTEND_URL && exit 0
          sleep 1
        done
        exit 1
    - name: Install Playwright browsers
      working-directory: e2e
      run: |
        uv sync --locked
        uv run playwright install --with-deps chromium firefox webkit
    - name: Run E2E tests
      working-directory: e2e
      run: uv run pytest -v --browser chromium --browser firefox --browser webkit

  docker:
    needs: [ api, frontend, e2e ] # Makes passing tests a requirement
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Build the API image
      uses: docker/build-push-action@v6
      with:
        context: api
        file: api/docker/Dockerfile
        push: false # Pushing happens in cd.yml
        cache-from: type=gha,scope=api
        cache-to: type=gha,mode=max,scope=api
    - name: Build the frontend image
      uses: docker/build-push-action@v6
      with:
        context: frontend
        file: frontend/docker/Dockerfile
        push: false
        cache-from: type=gha,scope=frontend
        cache-to: type=gha,mode=max,scope=frontend
