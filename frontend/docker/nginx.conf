server {
    listen 80;
    root /usr/share/nginx/html;

    # React Router handles these paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset names change when they do, so cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
